services:
  postgres:
    image: postgres:16-alpine
    container_name: zuckerheld-postgres
    environment:
      POSTGRES_DB: zuckerheld
      POSTGRES_USER: zuckerheld
      POSTGRES_PASSWORD: zuckerheld_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init-Skript: legt zuckerheld + keycloak DB an
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zuckerheld -d zuckerheld"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: zuckerheld-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: zuckerheld
      RABBITMQ_DEFAULT_PASS: zuckerheld_dev_pw
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI → http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: zuckerheld-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: zuckerheld_dev_pw
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: zuckerheld
      KC_DB_PASSWORD: zuckerheld_dev_pw
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"     # Keycloak Admin → http://localhost:8180
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: zuckerheld-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@zuckerheld.de
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"      # pgAdmin → http://localhost:5050
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  rabbitmq_data:
  pgadmin_data:

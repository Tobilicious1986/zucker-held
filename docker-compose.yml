version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zuckerheld-postgres
    environment:
      POSTGRES_DB: zuckerheld
      POSTGRES_USER: zuckerheld
      POSTGRES_PASSWORD: zuckerheld_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zuckerheld -d zuckerheld"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: zuckerheld-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: zuckerheld
      RABBITMQ_DEFAULT_PASS: zuckerheld_dev_pw
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI → http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: zuckerheld-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@zuckerheld.de
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"      # pgAdmin → http://localhost:5050
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  rabbitmq_data:
  pgadmin_data:

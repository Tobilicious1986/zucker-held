<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Zucker-Held</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ═══ SPLASH ═══════════════════════════════════════════════ -->
<div id="splash" class="splash">
  <div class="splash-content">
    <div class="splash-icon">🦸</div>
    <h1>Zucker-Held</h1>
    <p>Dein Diabetes-Begleiter</p>
  </div>
  <div class="splash-version">v4.1</div>
  <button id="splashResetBtn" onclick="window._emergencyReset()" style="display:none;position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);color:white;padding:8px 20px;border-radius:20px;font-size:13px;cursor:pointer">App zurücksetzen</button>
</div>

<script>
// Notfall-Reset: SW deregistrieren + alle Caches löschen
window._emergencyReset = async function() {
  if (!confirm('Service Worker und App-Cache zurücksetzen? Deine gespeicherten Daten bleiben erhalten.')) return;
  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    for (const r of regs) await r.unregister();
  }
  if ('caches' in window) {
    const keys = await caches.keys();
    for (const k of keys) await caches.delete(k);
  }
  window.location.reload(true);
};

// Wenn die App nach 4s noch nicht gestartet hat → Reset-Button zeigen
setTimeout(() => {
  const btn = document.getElementById('splashResetBtn');
  const splash = document.getElementById('splash');
  if (btn && splash && !splash.classList.contains('hidden')) {
    btn.style.display = 'block';
  }
}, 4000);
</script>

<!-- ═══ PROFIL-AUSWAHL ════════════════════════════════════════ -->
<div id="profileSelector" class="profile-selector hidden">
  <div class="profile-sel-inner">
    <div class="profile-sel-logo">🦸</div>
    <h1>Zucker-Held</h1>
    <p>Wer bist du?</p>
    <div id="profileList" class="profile-list">
      <div class="profile-empty">Noch kein Profil vorhanden.</div>
    </div>
    <button class="btn-add-profile" onclick="window.openAddProfile()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Neues Profil erstellen
    </button>
  </div>
</div>

<!-- ═══ APP SHELL ═════════════════════════════════════════════ -->
<div id="app" class="app hidden">

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <span class="hero-avatar" id="heroAvatar">🦸</span>
      <div>
        <div class="header-title">Zucker-Held</div>
        <div class="header-subtitle" id="headerDate"></div>
      </div>
    </div>
    <div class="header-right">
      <button class="btn-icon" id="settingsBtn" aria-label="Einstellungen" onclick="window.showPage('settings')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <!-- Seiten-Container (Module rendern ihren Inhalt) -->
  <main class="main" id="mainContent">
    <div id="page-home"     class="page page-home active"></div>
    <div id="page-bz"       class="page"></div>
    <div id="page-insulin"  class="page"></div>
    <div id="page-meal"     class="page"></div>
    <div id="page-calc"     class="page"></div>
    <div id="page-activity" class="page"></div>
    <div id="page-foods"    class="page"></div>
    <div id="page-history"  class="page"></div>
    <div id="page-learn"    class="page"></div>
    <div id="page-settings" class="page"></div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" role="navigation" aria-label="Hauptnavigation">
    <button class="nav-btn active" id="nav-home" onclick="window.showPage('home')">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
      </span>
      <span class="nav-label">Start</span>
    </button>
    <button class="nav-btn" id="nav-bz" onclick="window.showPage('bz')">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24"><path d="M12 21.7C8.1 21.7 5 18.4 5 14.3c0-5.2 7-13 7-13s7 7.8 7 13c0 4.1-3.1 7.4-7 7.4z"/></svg>
      </span>
      <span class="nav-label">Messen</span>
    </button>
    <button class="nav-btn nav-btn-center" id="nav-calc" onclick="window.showPage('calc')">
      <span class="nav-icon-wrap nav-icon">
        <svg viewBox="0 0 24 24" stroke="white" fill="none" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h4M8 15h2M16 15l-2 2 2 2"/></svg>
      </span>
      <span class="nav-label">Rechner</span>
    </button>
    <button class="nav-btn" id="nav-learn" onclick="window.showPage('learn')">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </span>
      <span class="nav-label">Lernen</span>
    </button>
    <button class="nav-btn" id="nav-history" onclick="window.showPage('history')">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      </span>
      <span class="nav-label">Verlauf</span>
    </button>
  </nav>

</div><!-- /#app -->

<!-- ═══ MODAL SHELLS ══════════════════════════════════════════
     Inhalt wird von Modulen per innerHTML gesetzt            -->
<div id="modal-add-profile"  class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Neues Profil"></div>
<div id="modal-pin"          class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="PIN eingeben"></div>
<div id="modal-food-search"  class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Lebensmittel suchen"></div>
<div id="modal-amount"       class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Menge eingeben"></div>
<div id="modal-barcode"      class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Barcode scannen"></div>
<div id="modal-new-food"     class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Lebensmittel hinzufügen"></div>
<div id="modal-confirm"      class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Bestätigung"></div>

<!-- ═══ GLOBALE UI ════════════════════════════════════════════ -->
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<div id="successAnim" class="success-anim hidden" aria-hidden="true">
  <div class="success-content">
    <div class="success-icon" id="successIcon"></div>
    <div class="success-text" id="successText"></div>
  </div>
</div>

<div id="achievementPopup" class="achievement-popup" aria-live="polite"></div>

<!-- SOS-Button (wird von app.js gesetzt wenn Kontakte vorhanden) -->
<button id="sosFab" class="sos-fab hidden" onclick="window.openSOS()" aria-label="Notfall / SOS">SOS</button>
<div id="helperOverlay" class="helper-overlay" role="dialog" aria-label="Notfall-Hilfe"></div>

<script type="module" src="app.js"></script>
</body>
</html>
